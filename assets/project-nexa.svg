<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">NEXA AI website mockup</title>
  <desc id="desc">Desktop and mobile mockup for the NEXA AI software landing page portfolio project.</desc>
  <defs>
    <linearGradient id="nexaBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3f6fb"/>
      <stop offset="100%" stop-color="#e6ecf7"/>
    </linearGradient>
    <linearGradient id="nexaDark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#131d2b"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a82ff"/>
      <stop offset="100%" stop-color="#4f58d8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#eaeef6"/>

  <g transform="translate(140 60)">
    <rect x="0" y="0" width="860" height="560" rx="22" fill="url(#nexaBg)" stroke="#d7e0ef" stroke-width="3"/>
    <rect x="0" y="0" width="860" height="72" rx="22" fill="#f7f9ff"/>
    <circle cx="34" cy="36" r="8" fill="#d6dce9"/>
    <circle cx="58" cy="36" r="8" fill="#d6dce9"/>
    <circle cx="82" cy="36" r="8" fill="#d6dce9"/>
    <rect x="118" y="18" width="18" height="18" rx="6" fill="url(#purple)"/>
    <text x="150" y="34" font-size="16" fill="#181d2a" font-family="Arial, sans-serif" font-weight="700">NEXA AI</text>
    <text x="446" y="35" font-size="11" fill="#586578" font-family="Arial, sans-serif">Product  Solutions  Integrations  Pricing  Resources</text>
    <rect x="730" y="20" width="88" height="30" rx="15" fill="url(#purple)"/>
    <text x="774" y="40" font-size="11" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Start Free</text>

    <g transform="translate(82 110)">
      <text x="0" y="30" font-size="18" fill="#7d89cb" font-family="Arial, sans-serif" letter-spacing="4">BUILT FOR MODERN TEAMS</text>
      <text x="0" y="118" font-size="64" fill="#151f2d" font-family="Arial, sans-serif" font-weight="700">AI that works</text>
      <text x="0" y="180" font-size="64" fill="#151f2d" font-family="Arial, sans-serif" font-weight="700">for you.</text>
      <text x="0" y="238" font-size="21" fill="#55657a" font-family="Arial, sans-serif">Automate repetitive work, connect your tools, and turn your</text>
      <text x="0" y="270" font-size="21" fill="#55657a" font-family="Arial, sans-serif">workflows into intelligent systems — without writing code.</text>
      <rect x="0" y="302" width="170" height="54" rx="27" fill="url(#purple)"/>
      <text x="85" y="336" font-size="22" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Start Free</text>
      <rect x="192" y="302" width="196" height="54" rx="27" fill="#fff" stroke="#d5ddea" stroke-width="2"/>
      <text x="290" y="336" font-size="22" fill="#1b2433" text-anchor="middle" font-family="Arial, sans-serif">See How It Works</text>
    </g>

    <g transform="translate(540 122)">
      <rect x="0" y="0" width="250" height="290" rx="20" fill="url(#nexaDark)"/>
      <rect x="22" y="24" width="206" height="40" rx="12" fill="#202d3f"/>
      <rect x="36" y="35" width="30" height="18" rx="9" fill="#7a82ff"/>
      <text x="80" y="49" font-size="16" fill="#edf2ff" font-family="Arial, sans-serif">NEXA AI</text>
      <rect x="22" y="78" width="206" height="184" rx="14" fill="#f3f6fb"/>
      <rect x="38" y="94" width="76" height="70" rx="12" fill="#d8deff"/>
      <rect x="128" y="94" width="84" height="12" rx="6" fill="#dfe6f5"/>
      <rect x="128" y="116" width="62" height="12" rx="6" fill="#dfe6f5"/>
      <rect x="128" y="138" width="84" height="12" rx="6" fill="#dfe6f5"/>
      <rect x="38" y="182" width="178" height="12" rx="6" fill="#e4ebfb"/>
      <rect x="38" y="204" width="150" height="12" rx="6" fill="#e4ebfb"/>
      <rect x="38" y="226" width="120" height="12" rx="6" fill="#e4ebfb"/>
    </g>
  </g>

  <g transform="translate(1018 150)">
    <rect x="0" y="0" width="120" height="340" rx="24" fill="#111b2a"/>
    <rect x="20" y="34" width="80" height="18" rx="9" fill="#1f2e44"/>
    <text x="60" y="47" font-size="10" fill="#edf2ff" text-anchor="middle" font-family="Arial, sans-serif">NEXA AI</text>
    <rect x="20" y="70" width="80" height="200" rx="16" fill="#f2f6fb"/>
    <rect x="30" y="90" width="60" height="12" rx="6" fill="#dfe9fb"/>
    <rect x="30" y="108" width="54" height="12" rx="6" fill="#dfe9fb"/>
    <rect x="30" y="130" width="30" height="30" rx="8" fill="#d1d9ff"/>
    <rect x="30" y="170" width="60" height="12" rx="6" fill="#dde6f9"/>
    <rect x="30" y="190" width="52" height="12" rx="6" fill="#dde6f9"/>
    <rect x="30" y="210" width="44" height="12" rx="6" fill="#dde6f9"/>
    <rect x="24" y="284" width="72" height="30" rx="15" fill="url(#purple)"/>
    <text x="60" y="304" font-size="10" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">Start free</text>
  </g>
